; PlatformIO Project Configuration File for CompressorProtect (CH32V003)
; Ported from LGT8F328P to CH32V003A4M6 (32-bit RISC-V @ 48 MHz)

[env:genericCH32V003A4M6]
platform = ch32v
board = genericCH32V003A4M6
framework = ch32v003fun
upload_protocol = minichlink
debug_tool = minichlink
build_flags =
    -Os
    -flto
    -I"${platformio.packages_dir}/framework-ch32v003fun/ch32fun"
build_unflags =
    -O2
