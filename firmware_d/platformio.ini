[env:ch32v003a4m6]
platform = ch32v
board = genericCH32V003A4M6
framework = ch32v003fun
board_build.f_cpu = 48000000L
upload_protocol = minichlink
monitor_speed = 115200

build_unflags =
    -Os

build_flags =
    -I.
    -Isrc
    -std=gnu11
    -O2
    -fno-strict-aliasing
    -fwrapv
    -mstrict-align
    -ffunction-sections
    -fdata-sections
    -fstack-usage
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wshadow
    -Wundef
    -Werror=implicit-function-declaration
    -Werror=return-type
    -Wl,--gc-sections

check_flags =
    --suppress=unusedFunction